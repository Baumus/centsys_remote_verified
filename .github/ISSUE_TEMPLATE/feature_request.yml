name: Feature request
description: Propose a focused improvement to this experimental fork.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: "Explain the need without private account, device or property details."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and alternatives
      description: Include safety, compatibility and offline-test considerations where relevant.
    validations:
      required: true
